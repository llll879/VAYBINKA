function showRegister(){const b=$('authbox');b.innerHTML=`<h2>Регистрация</h2><p class="muted">Минимальный возраст — 10 лет. После регистрации нужно пройти обязательную обучалку.</p><div class="two"><div class="field"><label>Имя</label><input id="rn" class="input"></div><div class="field"><label>Возраст</label><input id="ra" class="input" type="number" min="10" max="99"></div></div><div class="field"><label>@username</label><input id="ru" class="input" placeholder="@AAAAA"></div><div class="two"><div class="field"><label>Пол</label><select id="rg" class="select"><option value="f">Девушка</option><option value="m">Парень</option><option value="other">Другое</option></select></div><div class="field"><label>Город</label><input id="rc" class="input" list="cities" placeholder="Москва"><datalist id="cities">${typeof RU_CITIES!=='undefined'?RU_CITIES.map(c=>`<option value="${c}">`).join(''):''}</datalist></div></div><div class="field"><label>Пароль</label><input id="rp" class="input" type="password" minlength="8"></div><div class="field"><label>О себе</label><textarea id="rb" class="textarea" placeholder="Интересы и увлечения"></textarea></div><label class="muted">Интересы</label><div class="choice" id="ri">${interests.map(x=>`<button onclick="this.classList.toggle('on')">${x}</button>`).join('')}</div><div class="field"><label>Что ты ищешь?</label><div class="choice" id="rl">${['Дружба','Общие интересы','Общение','Отношения (18+)'].map(x=>`<button onclick="this.classList.toggle('on')">${x}</button>`).join('')}</div></div><button class="btn primary wide" onclick="register()">Создать аккаунт</button><p class="muted" style="text-align:center"><a href="#" onclick="showLogin();return false" style="color:#ff72a5">Уже есть аккаунт</a></p>`}
async function register(){const age=+$('ra').value||0,lf=[...$('rl').querySelectorAll('.on')].map(x=>x.textContent);if(age<10)return toast('Минимальный возраст — 10 лет');if(age<18&&lf.includes('Отношения (18+)'))return toast('Этот вариант доступен только с 18 лет');const body={name:$('rn').value.trim(),age,username:$('ru').value.trim(),gender:$('rg').value,city:$('rc').value.trim(),password:$('rp').value,bio:$('rb').value.trim(),interests:[...$('ri').querySelectorAll('.on')].map(x=>x.textContent),lookingFor:lf};try{const d=await api('/api/auth/register',{method:'POST',body});token=d.token;saveToken();me=d.user;renderOnboarding();refresh().catch(()=>{})}catch(e){const msg={username_taken:'Этот @username уже занят. Придумай другой.',bad_username:'Username должен быть в формате @AAAAA и содержать 3–20 латинских букв, цифр или _.',name_required:'Укажи имя.',bad_age:'Возраст должен быть от 10 до 120 лет.',password_short:'Пароль должен содержать минимум 8 символов.',minor_relationship_blocked:'«Отношения (18+)» доступны только пользователям 18+.',registration_failed:'Сервер не смог создать аккаунт. Проверь, что сервер запущен с последней версией VYBINKA.'}[e.message]||'Не удалось зарегистрироваться. Проверь данные и попробуй ещё раз.';toast(msg);const box=document.getElementById('authbox');if(box){let el=document.getElementById('regError');if(!el){el=document.createElement('div');el.id='regError';el.style.cssText='margin:12px 0;padding:12px 14px;border:1px solid #7d2948;background:#321321;color:#ff9fbd;border-radius:14px;font-size:14px;';box.prepend(el)}el.textContent=msg}}}
async function login(){try{const d=await api('/api/auth/login',{method:'POST',body:{username:$('au').value,password:$('ap').value}});token=d.token;saveToken();me=d.user;await refresh();renderApp('feed');connectWS()}catch(e){toast('Неверный логин или пароль')}}
function renderOnboarding(){document.body.innerHTML='<div class="auth"><div class="auth-card panel" style="text-align:center"><img src="'+stickers[1]+'" style="width:170px;height:170px;object-fit:contain"><h1>Привет, '+esc(me.name)+'! 🪽</h1><p class="muted">Я Лили. Это обязательная короткая обучалка VYBINKA. Здесь ты узнаешь про ленту, чаты, рулетку и безопасность.</p><div class="card" style="padding:16px;text-align:left;margin:18px 0"><b>1. Лента</b><p class="muted">❤️ — нравится, 👎 — пропустить. Никаких требований отправлять личные данные.</p><b>2. Чаты</b><p class="muted">Можно отправлять текст, фото, видео, голосовые и стикеры. Сообщения можно редактировать, удалять, отвечать и пересылать.</p><b>3. Безопасность</b><p class="muted">Не сообщай адрес, школу, телефон, пароли и коды. Подозрительные профили блокируй и жалуйся.</p><b>4. Каналы и группы</b><p class="muted">Группы — для общения. Каналы — для публикаций владельца и назначенных админов.</p></div><button class="btn primary wide" onclick="finishOnboarding()">Я всё понял(а), войти</button></div></div>'}
function finishOnboarding(){localStorage.setItem('vybinka_onboard_'+me.id,'1');renderApp('feed');connectWS()}
function renderApp(tab='feed'){document.body.innerHTML='<div class="app"><header class="top"><div class="brand"><img src="/logo.png"><b>VYBINKA</b><span>10+</span></div><div class="top-actions"><button class="iconbtn" onclick="openSearch()">⌕</button><button class="iconbtn" onclick="openLily()">🪽</button></div></header><main class="main" id="main"></main><nav class="nav">'+[['feed','◉','Лента'],['roulette','🎲','Рулетка'],['chats','💬','Чаты'],['likes','♡','Лайки'],['channels','▣','Каналы'],['profile','●','Профиль']].map(x=>`<button data-tab="${x[0]}" onclick="navigate('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('')+'</nav></div>';navigate(tab)}
async function navigate(tab){document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));const m=$('main');if(tab==='feed')return renderFeed(m);if(tab==='roulette')return renderRoulette(m);if(tab==='chats')return renderChats(m);if(tab==='likes')return renderLikes(m);if(tab==='channels')return renderChannels(m);if(tab==='profile')return renderProfile(m)}
function renderFeed(m){const p=users[0];m.innerHTML='<div class="panel hero"><div><h1>VYBINKA</h1><p>Находи людей с похожими интересами, общайся, создавай группы и каналы. Всё управление — в одном месте.</p><button class="btn primary" onclick="openLily()">Спросить Лили 🪽</button></div><img src="'+stickers[1]+'"></div><div class="section-head"><h2>Лента</h2><button class="btn" onclick="loadUsers()">Обновить</button></div><div id="feedbox"></div><div class="footer">Новости: <a href="https://t.me/VYBINKA_NEWS" target="_blank">@VYBINKA_NEWS</a> · Модерация: <a href="https://t.me/immortalBEC" target="_blank">@immortalBEC</a> / <a href="https://t.me/LiliVYBINKA" target="_blank">@LiliVYBINKA</a></div>';showFeedCard(p)}
function showFeedCard(p){const box=$('feedbox');if(!p){box.innerHTML='<div class="panel pad"><h2>Больше анкет нет</h2><p class="muted">Попробуй обновить ленту.</p></div>';return}box.innerHTML=`<div class="panel feed-card"><div class="photo"><img src="${esc(p.avatar||'/logo.png')}"><div class="fade"></div></div><div class="info"><h2>${esc(p.name)}, ${p.age}</h2><div class="username">${esc(p.username)} · ${esc(p.city||'')}</div><p>${esc(p.bio||'')}</p><div class="chips">${(p.interests||[]).slice(0,4).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div><div class="actions"><button class="btn danger" onclick="act('${p.id}','pass')">👎 Не нравится</button><button class="btn" onclick="openPerson('${p.id}')">Профиль</button><button class="btn primary" onclick="act('${p.id}','like')">♥ Нравится</button></div></div>`}
async function act(id,action){try{const d=await api('/api/users/'+id+'/action',{method:'POST',body:{action}});toast(d.match?'Взаимная симпатия! Чат открыт 💗':'Готово');if(d.match){const c=await api('/api/chats/direct/'+id,{method:'POST'});openChat(c.chatId)}else{users=users.filter(x=>x.id!==id);showFeedCard(users[0])}}catch(e){toast('Не удалось выполнить действие')}}async function loadUsers(){const d=await api('/api/users?limit=30');users=d.users;showFeedCard(users[0])}
function renderRoulette(m){m.innerHTML='<div class="panel pad"><h1>🎲 Чат-рулетка</h1><p class="muted">Подбор собеседника по безопасным фильтрам.</p><div class="two"><div class="field"><label>Город</label><input id="qcity" class="input" placeholder="Москва"></div><div class="field"><label>Возраст</label><input id="qage" class="input" type="number" min="10" max="99" placeholder="14"></div></div><div class="field"><label>Пол собеседника</label><select id="qgender" class="select"><option value="">Любой</option><option value="f">Девушка</option><option value="m">Парень</option></select></div><button class="btn primary wide" onclick="roulette()">Найти собеседника</button><div id="rout" style="margin-top:18px"></div></div>'}
async function roulette(){const q=new URLSearchParams({city:$('qcity').value,age:$('qage').value,gender:$('qgender').value});const d=await api('/api/users?limit=50');let list=d.users.filter(x=>!q.get('city')||x.city?.toLowerCase().includes(q.get('city').toLowerCase())).filter(x=>!q.get('gender')||x.gender===q.get('gender')).filter(x=>!q.get('age')||Math.abs(x.age-+q.get('age'))<=3);const p=list[Math.floor(Math.random()*list.length)];$('rout').innerHTML=p?`<div class="person"><img src="${p.avatar||'/logo.png'}"><div class="grow"><b>${esc(p.name)}, ${p.age}</b><small>${esc(p.city)} · ${esc(p.username)}</small></div><button class="btn primary" onclick="startDirect('${p.id}')">Открыть чат</button></div>`:'<div class="danger-card panel pad">Никого не нашла. Попробуй изменить фильтры.</div>'}
async function startDirect(id){const d=await api('/api/chats/direct/'+id,{method:'POST'});openChat(d.chatId)}
function renderChats(m){m.innerHTML=`<div class="section-head"><h1>Чаты</h1><button class="btn" onclick="openSearch()">Найти человека</button></div><div class="list">${chats.map(c=>{const other=c.members?.find(x=>x.id!==me.id);return `<div class="person" onclick="openChat('${c.id}')"><img src="${other?.avatar||'/logo.png'}"><div class="grow"><b>${esc(c.name||other?.name||'Чат')}</b><small>${esc(other?.username||'')}</small></div><span>›</span></div>`}).join('')}</div><div class="section-head"><h2>Сообщества</h2></div><div class="two"><button class="btn primary" onclick="createGroup()">＋ Создать группу</button><button class="btn" onclick="navigate('channels')">Каналы →</button></div>`}
function renderLikes(m){m.innerHTML='<div class="section-head"><h1>Лайки</h1></div><div class="section-head"><h2>Тебя лайкнули</h2></div><div class="list">'+likes.incoming.map(p=>personHtml(p)).join('')+'</div><div class="section-head"><h2>Ты лайкнул(а)</h2></div><div class="list">'+likes.outgoing.map(p=>personHtml(p)).join('')+'</div>'}function personHtml(p){return `<div class="person"><img src="${p.avatar||'/logo.png'}"><div class="grow"><b>${esc(p.name)}, ${p.age}</b><small>${esc(p.username)} · ${esc(p.city)}</small></div><button class="btn" onclick="openPerson('${p.id}')">Открыть</button></div>`}
function renderProfile(m){m.innerHTML=`<div class="grid"><div class="card profile-card"><div class="cover" style="background-image:url('${esc(me.cover||'/news-banner.png')}')"></div><div class="body"><img class="avatar" src="${esc(me.avatar||'/logo.png')}"><div class="name">${esc(me.name)}, ${me.age}</div><div class="username">${esc(me.username)}</div>${me.mood?`<div class="mood">${esc(me.mood)}</div>`:''}<p>${esc(me.bio||'')}</p><div class="chips">${(me.interests||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><div class="section-head"><h2>Что ищу</h2></div><div class="chips">${(me.lookingFor||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div></div><div><div class="panel pad"><h2>Профиль</h2><button class="btn primary wide" onclick="editProfile()">Редактировать</button><button class="btn wide" style="margin-top:8px" onclick="setMood()">😊 Настроение сегодня</button><button class="btn wide" style="margin-top:8px" onclick="logout()">Выйти</button></div><div class="panel pad" style="margin-top:14px"><h2>VYBINKA</h2><p class="muted">Новости и модерация</p><p>📰 <a href="https://t.me/VYBINKA_NEWS" target="_blank" style="color:#ff72a5">@VYBINKA_NEWS</a></p><p>🛡️ <a href="https://t.me/immortalBEC" target="_blank" style="color:#ff72a5">@immortalBEC</a></p><p>🪽 <a href="https://t.me/LiliVYBINKA" target="_blank" style="color:#ff72a5">@LiliVYBINKA</a></p></div></div></div>`}
function editProfile(){openModal(`<div class="sheet-head"><h2>Редактировать профиль</h2><button class="iconbtn" onclick="closeModal()">×</button></div><div class="field"><label>Имя</label><input id="en" class="input" value="${esc(me.name)}"></div><div class="field"><label>Город</label><input id="ec" class="input" value="${esc(me.city||'')}"></div><div class="field"><label>О себе</label><textarea id="eb" class="textarea">${esc(me.bio||'')}</textarea></div><div class="field"><label>Аватар</label><input id="ea" type="file" class="input" accept="image/*"></div><div class="field"><label>Обложка</label><input id="eco" type="file" class="input" accept="image/*"></div><div class="field"><label>Музыка</label><input id="em" type="file" class="input" accept="audio/*"></div><button class="btn primary wide" onclick="saveProfile()">Сохранить</button>`)}
async function uploadFile(input){if(!input.files[0])return '';const fd=new FormData();fd.append('file',input.files[0]);const d=await api('/api/upload',{method:'POST',body:fd});return d.url}async function saveProfile(){try{const avatar=await uploadFile($('ea')),cover=await uploadFile($('eco')),music=await uploadFile($('em'));const d=await api('/api/me',{method:'PUT',body:{name:$('en').value,city:$('ec').value,bio:$('eb').value,avatar:avatar||me.avatar,cover:cover||me.cover,music:music||me.music}});me=d.user;closeModal();renderProfile($('main'));toast('Профиль сохранён')}catch(e){toast('Не удалось сохранить')}}
function setMood(){const moods=['😀 Отлично','🙂 Хорошо','😐 Нормально','😔 Грустно','😤 Злюсь','😴 Устал(а)','🤩 Вдохновлён(а)'];openModal('<div class="sheet-head"><h2>Настроение сегодня</h2><button class="iconbtn" onclick="closeModal()">×</button></div><div class="choice">'+moods.map(x=>`<button onclick="setMoodApi('${x.replace(/'/g,"\\'")}')">${x}</button>`).join('')+'</div>')};async function setMoodApi(x){await api('/api/me/mood',{method:'POST',body:{mood:x}});me.mood=x;closeModal();renderProfile($('main'));toast('Настроение обновлено')}
function renderChannels(m){m.innerHTML='<div class="section-head"><h1>Каналы</h1><button class="btn primary" onclick="createChannel()">＋ Создать</button></div><div class="list">'+channels.map(c=>`<div class="channel"><h2>${esc(c.name)}</h2><p class="muted">@${esc(c.username?.replace(/^@/,''))}</p><p>${esc(c.description||'')}</p><button class="btn" onclick="openChannel('${c.id}')">Открыть</button></div>`).join('')+'</div>'}
async function createGroup(){const name=prompt('Название группы');if(!name)return;await api('/api/groups',{method:'POST',body:{name}});await refresh();navigate('chats');toast('Группа создана')}
async function createChannel(){const name=prompt('Название канала');if(!name)return;const username=prompt('Уникальный @username канала');if(!username)return;try{await api('/api/channels',{method:'POST',body:{name,username,description:'Канал VYBINKA'}});await refresh();renderChannels($('main'));toast('Канал создан')}catch(e){toast(e.message==='username_taken'?'Такой ник канала уже занят':'Не удалось создать')}}
async function openChannel(id){const d=await api('/api/channels/'+id+'/posts');const c=channels.find(x=>x.id===id);openModal(`<div class="sheet-head"><div><h2>${esc(c?.name||'Канал')}</h2><span class="muted">${esc(c?.username||'')}</span></div><button class="iconbtn" onclick="closeModal()">×</button></div>${d.posts.map(p=>`<div class="card" style="padding:14px;margin-bottom:10px"><p>${esc(p.content)}</p><small class="muted">${new Date(p.created_at).toLocaleString()}</small></div>`).join('')||'<p class="muted">Пока нет публикаций.</p>'}${c?.owner_id===me.id?'<div class="field"><textarea id="cp" class="textarea" placeholder="Новая публикация"></textarea></div><button class="btn primary wide" onclick="publishChannel(\''+id+'\')">Опубликовать</button>':''}`)}async function publishChannel(id){await api('/api/channels/'+id+'/posts',{method:'POST',body:{content:$('cp').value}});openChannel(id)}
function openPerson(id){const p=users.find(x=>x.id===id)||likes.incoming.find(x=>x.id===id)||likes.outgoing.find(x=>x.id===id);if(!p)return;openModal(`<div class="sheet-head"><h2>${esc(p.name)}, ${p.age}</h2><button class="iconbtn" onclick="closeModal()">×</button></div><img src="${p.avatar||'/logo.png'}" style="width:100%;height:300px;object-fit:cover;border-radius:20px"><p class="muted">${esc(p.username)} · ${esc(p.city)}</p><p>${esc(p.bio||'')}</p><div class="chips">${(p.interests||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><div class="two" style="margin-top:14px"><button class="btn primary" onclick="closeModal();startDirect('${p.id}')">💬 Чат</button><button class="btn danger" onclick="report('${p.id}')">🚩 Пожаловаться</button></div><button class="btn danger wide" style="margin-top:8px" onclick="block('${p.id}')">⛔ Заблокировать</button>`)}
async function block(id){await api('/api/blocks/'+id,{method:'POST'});closeModal();toast('Пользователь заблокирован')};async function report(id){const reason=prompt('Причина жалобы');if(!reason)return;await api('/api/reports',{method:'POST',body:{targetId:id,reason}});closeModal();toast('Жалоба отправлена модерации')}
function connectWS(){if(!token)return;try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/?token='+encodeURIComponent(token));ws.onmessage=e=>{const x=JSON.parse(e.data);if(x.event==='message'){const c=chats.find(c=>c.id===x.message.chat_id);if(c){c.messages.push(x.message);if(currentChat===c.id)renderChatBody()}}if(x.event==='message_updated'||x.event==='message_deleted')refresh().then(()=>{if(currentChat)renderChatBody()})}}catch{}}
function openChat(id){currentChat=id;document.body.insertAdjacentHTML('beforeend','<div id="chat" class="chat"></div>');renderChat();}function renderChat(){const c=chats.find(x=>x.id===currentChat);if(!c)return;const other=c.members?.find(x=>x.id!==me.id);$('chat').innerHTML=`<div class="chat-head"><img class="avatar" src="${other?.avatar||'/logo.png'}"><div class="chat-title"><b>${esc(c.name||other?.name||'Чат')}</b><small>${esc(other?.username||'')} · онлайн</small></div><button class="iconbtn" onclick="chatMenu()">⋮</button><button class="iconbtn" onclick="closeChat()">×</button></div><div id="chatbody" class="chat-body"></div><div class="chat-tools"><div class="sticker-row">${stickers.map((s,i)=>`<button onclick="sendSticker('${s}')"><img src="${s}" alt="стикер ${i+1}"></button>`).join('')}</div><div class="composer"><input id="msg" class="input" placeholder="Напиши сообщение..." onkeydown="if(event.key==='Enter')sendText()"><button class="circle" onclick="chooseMedia()">🖼️</button><input id="media" type="file" hidden accept="image/*,video/*" onchange="sendMedia()"><button class="circle" onclick="recordVoice()">🎙️</button><button class="circle" onclick="sendText()">➤</button></div></div>`;renderChatBody()}
function renderChatBody(){const b=$('chatbody');if(!b)return;const c=chats.find(x=>x.id===currentChat);b.innerHTML=(c?.messages||[]).map(m=>{const mine=m.sender_id===me.id;let content=esc(m.content||'');if(['photo','video','voice'].includes(m.type)){if(m.type==='photo')content=`<img class="media" src="${esc(m.content)}" onclick="viewOnce('${m.id}')">`;if(m.type==='video')content=`<video class="media" src="${esc(m.content)}" controls></video>`;if(m.type==='voice')content=`<audio src="${esc(m.content)}" controls></audio>`}if(m.type==='sticker')content=`<img class="media" style="width:150px" src="${esc(m.content)}">`;const rx=(m.reactions||[]).map(r=>r.emoji).join('');return `<div class="bubble ${mine?'me':''}">${m.forwarded_from?'<small>↗ Переслано</small>':''}${m.reply_to?'<small>↩ Ответ</small>':''}${content}${rx?`<div class="reactions">${esc(rx)}</div>`:''}${m.edited?' <i>изменено</i>':''}<small>${new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} ${mine?' ·✓✓':''}</small><div style="margin-top:5px;display:flex;gap:4px;flex-wrap:wrap"><button class="iconbtn mini" onclick="replyMsg('${m.id}')">↩</button><button class="iconbtn mini" onclick="reactMsg('${m.id}','❤️')">❤️</button><button class="iconbtn mini" onclick="forwardMsg('${m.id}')">↗</button>${mine?`<button class="iconbtn mini" onclick="editMsg('${m.id}')">✎</button><button class="iconbtn mini" onclick="delMsg('${m.id}')">⌫</button>`:''}</div></div>`}).join('');b.scrollTop=b.scrollHeight}
async function sendText(){const v=$('msg').value.trim();if(!v)return;try{await api('/api/chats/'+currentChat+'/messages',{method:'POST',body:{type:'text',content:v}});$('msg').value='';await refresh();renderChatBody()}catch(e){toast('Не удалось отправить сообщение')}}
async function sendSticker(s){try{await api('/api/chats/'+currentChat+'/messages',{method:'POST',body:{type:'sticker',content:s}});await refresh();renderChatBody()}catch{toast('Не удалось отправить стикер')}}
function chooseMedia(){const input=$('media');input?.click()}
async function sendMedia(){const f=$('media')?.files?.[0];if(!f)return;if(f.type.startsWith('image/'))return openImageEditor(f);return uploadAndSendMedia(f,'video',false)}
async function uploadAndSendMedia(f,type,oneView){const fd=new FormData();fd.append('file',f,f.name||('media.'+(type==='voice'?'webm':'bin')));try{const d=await api('/api/upload',{method:'POST',body:fd});await api('/api/chats/'+currentChat+'/messages',{method:'POST',body:{type,content:d.url,oneView:!!oneView}});await refresh();renderChatBody()}catch{toast('Не удалось отправить файл')}}
function openImageEditor(file){const url=URL.createObjectURL(file);openModal(`<div class="sheet-head"><h2>Фото</h2><button class="iconbtn" onclick="closeImageEditor()">×</button></div><div class="editor"><canvas id="photoCanvas"></canvas></div><div class="two"><button class="btn" onclick="cropSquare()">Обрезать</button><button class="btn" onclick="toggleDraw()">✏️ Рисовать</button></div><div class="field"><input id="photoCaption" class="input" placeholder="Подпись к фото (необязательно)"></div><label class="check"><input id="oneView" type="checkbox"> Удалить после первого просмотра</label><button class="btn primary wide" style="margin-top:10px" onclick="sendEditedPhoto()">Отправить фото</button>`);const img=new Image();img.onload=()=>{const c=$('photoCanvas'),max=900,scale=Math.min(1,max/img.width,max/img.height);c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);window._photoEditor={img,c,ctx,scale,draw:false,down:false,lastX:0,lastY:0};bindCanvasDraw();URL.revokeObjectURL(url)};img.src=url}
function closeImageEditor(){window._photoEditor=null;closeModal()}
function cropSquare(){const e=window._photoEditor;if(!e)return;const size=Math.min(e.c.width,e.c.height),sx=(e.c.width-size)/2,sy=(e.c.height-size)/2;const tmp=document.createElement('canvas');tmp.width=tmp.height=size;tmp.getContext('2d').drawImage(e.c,sx,sy,size,size,0,0,size,size);e.c.width=e.c.height=size;e.c.getContext('2d').drawImage(tmp,0,0);e.ctx=e.c.getContext('2d')}
function toggleDraw(){const e=window._photoEditor;if(!e)return;e.draw=!e.draw;toast(e.draw?'Режим рисования включён':'Режим рисования выключен')}
function bindCanvasDraw(){const c=$('photoCanvas'),e=window._photoEditor;if(!c||!e)return;c.onpointerdown=x=>{if(!e.draw)return;e.down=true;e.lastX=x.offsetX;e.lastY=x.offsetY};c.onpointermove=x=>{if(!e.draw||!e.down)return;const ctx=e.ctx;ctx.strokeStyle='#ff3d83';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(e.lastX,e.lastY);ctx.lineTo(x.offsetX,x.offsetY);ctx.stroke();e.lastX=x.offsetX;e.lastY=x.offsetY};c.onpointerup=()=>e.down=false;c.onpointerleave=()=>e.down=false}
async function sendEditedPhoto(){const e=window._photoEditor,c=$('photoCanvas');if(!e||!c)return;const caption=$('photoCaption').value.trim();if(caption){const ctx=e.ctx;ctx.font='bold 24px system-ui';ctx.fillStyle='white';ctx.strokeStyle='black';ctx.lineWidth=6;ctx.strokeText(caption,18,c.height-24);ctx.fillText(caption,18,c.height-24)}c.toBlob(async blob=>{const f=new File([blob],'photo.jpg',{type:'image/jpeg'});const one=$('oneView').checked;closeImageEditor();await uploadAndSendMedia(f,'photo',one)},'image/jpeg',.92)}
async function reactMsg(id,emoji){try{await api('/api/messages/'+id+'/reaction',{method:'POST',body:{emoji}});await refresh();renderChatBody()}catch{}}
function forwardMsg(id){openModal(`<div class="sheet-head"><h2>Переслать сообщение</h2><button class="iconbtn" onclick="closeModal()">×</button></div><div class="list">${chats.filter(c=>c.id!==currentChat).map(c=>`<button class="person" onclick="doForward('${id}','${c.id}')"><span>${esc(c.name||c.members?.find(x=>x.id!==me.id)?.name||'Чат')}</span></button>`).join('')||'<p class="muted">Нет других чатов.</p>'}</div>`)}
async function doForward(id,chatId){try{await api('/api/messages/'+id+'/forward',{method:'POST',body:{chatId}});closeModal();toast('Сообщение переслано')}catch{toast('Не удалось переслать')}}

let recorder,voiceChunks=[];async function recordVoice(){if(!navigator.mediaDevices?.getUserMedia)return toast('Микрофон недоступен');if(recorder?.state==='recording'){recorder.stop();return}const stream=await navigator.mediaDevices.getUserMedia({audio:true});voiceChunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>voiceChunks.push(e.data);recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(voiceChunks,{type:'audio/webm'});const fd=new FormData();fd.append('file',blob,'voice.webm');const d=await api('/api/upload',{method:'POST',body:fd});await api('/api/chats/'+currentChat+'/messages',{method:'POST',body:{type:'voice',content:d.url}});await refresh();renderChatBody()};recorder.start();toast('Запись... нажми 🎙️ ещё раз для отправки')}
function replyMsg(id){const m=chats.find(c=>c.id===currentChat).messages.find(x=>x.id===id);if(m){$('msg').value='↩ '+(m.content||'')+'\n';$('msg').focus()}}async function editMsg(id){const m=chats.find(c=>c.id===currentChat).messages.find(x=>x.id===id);const v=prompt('Изменить сообщение',m?.content||'');if(v!==null){await api('/api/messages/'+id,{method:'PATCH',body:{content:v}});await refresh();renderChatBody()}}async function delMsg(id){if(confirm('Удалить сообщение?')){await api('/api/messages/'+id,{method:'DELETE'});await refresh();renderChatBody()}}async function viewOnce(id){await api('/api/messages/'+id+'/view',{method:'POST'})}
function chatMenu(){const c=chats.find(x=>x.id===currentChat);openModal(`<div class="sheet-head"><h2>Настройки чата</h2><button class="iconbtn" onclick="closeModal()">×</button></div><button class="btn danger wide" onclick="deleteChat()">🗑️ Удалить чат</button><button class="btn danger wide" style="margin-top:8px" onclick="blockChat()">⛔ Заблокировать пользователя</button><button class="btn wide" style="margin-top:8px" onclick="reportChat()">🚩 Пожаловаться</button>`)}async function deleteChat(){await api('/api/chats/'+currentChat,{method:'DELETE'});closeModal();closeChat();await refresh();navigate('chats')};async function blockChat(){await api('/api/chats/'+currentChat+'/block',{method:'POST'});closeModal();toast('Пользователь заблокирован')};async function reportChat(){const c=chats.find(x=>x.id===currentChat),o=c.members.find(x=>x.id!==me.id);await report(o.id)}function closeChat(){$('chat')?.remove();currentChat=null}
function openSearch(){openModal('<div class="sheet-head"><h2>Поиск по @username</h2><button class="iconbtn" onclick="closeModal()">×</button></div><input id="sq" class="input" placeholder="@AAAAA"><button class="btn primary wide" style="margin-top:10px" onclick="doSearch()">Найти</button><div id="sr" style="margin-top:12px"></div>')};async function doSearch(){let q=$('sq').value.trim();if(!q.startsWith('@'))q='@'+q;try{const d=await api('/api/users/'+encodeURIComponent(q));$('sr').innerHTML=personHtml(d.user)}catch{$('sr').innerHTML='<p class="muted">Пользователь не найден.</p>'}}
function openLily(){if($('lily'))return;document.body.insertAdjacentHTML('beforeend',`<div id="lily" class="chat lily"><div class="chat-head"><img class="avatar" src="${stickers[1]}"><div class="chat-title"><b>Лили</b><small>AI-помощница VYBINKA</small></div><button class="iconbtn" onclick="closeLily()">×</button></div><div id="lilybody" class="chat-body"><div class="bubble">Привет! Я Лили 🪽. Могу помочь освоиться на сайте или просто поболтать.</div></div><div class="chat-tools"><div class="composer"><input id="lilyinput" class="input" placeholder="Спроси Лили..." onkeydown="if(event.key==='Enter')askLily()"><button class="circle" onclick="askLily()">➤</button></div></div></div>`);$('lilyinput')?.focus()}
function closeLily(){$('lily')?.remove()}
async function askLily(){const v=$('lilyinput').value.trim();if(!v)return;lilyHistory.push({role:'user',content:v});$('lilybody').insertAdjacentHTML('beforeend','<div class="bubble me">'+esc(v)+'</div>');$('lilyinput').value='';try{const d=await api('/api/lily',{method:'POST',body:{messages:lilyHistory}});lilyHistory.push({role:'assistant',content:d.reply});$('lilybody').insertAdjacentHTML('beforeend','<div class="bubble">'+esc(d.reply).replace(/\n/g,'<br>')+'</div>')}catch{toast('Лили временно недоступна')}}
boot();

</script><script src="/vkb_fixes.js"></script></body></html>
